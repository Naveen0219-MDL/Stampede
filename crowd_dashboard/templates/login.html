<!DOCTYPE html>
<html>
<head>
<title>Crowd Risk Login</title>
<style>
body {
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}
.card {
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    padding:40px;
    border-radius:16px;
    width:320px;
    box-shadow:0 0 30px rgba(0,0,0,0.4);
}
input {
    width:100%;
    padding:12px;
    margin-top:12px;
    border:none;
    border-radius:8px;
}
button {
    margin-top:15px;
    width:100%;
    padding:12px;
    background:#3b82f6;
    border:none;
    color:white;
    border-radius:8px;
    font-weight:bold;
}
.error {
    color:#ef4444;
    margin-top:10px;
}
</style>
</head>
<body>

<div class="card">
<h2>Crowd Monitoring Login</h2>
<form method="POST">
<input type="text" name="username" placeholder="Username" required>
<input type="password" name="password" placeholder="Password" required>
<button>Login</button>
</form>
{% if error %}
<div class="error">{{ error }}</div>
{% endif %}
</div>

</body>
</html>
